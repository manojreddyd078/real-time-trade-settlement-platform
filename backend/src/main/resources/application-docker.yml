spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/trade_settlement}
    username: ${DATABASE_USERNAME:trade_user}
    password: ${DATABASE_PASSWORD:trade_password}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

logging:
  level:
    com.tradesettlement: INFO
