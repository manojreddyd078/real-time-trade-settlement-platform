spring:
  application:
    name: trade-settlement-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: settlement
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: settlement
    schemas: settlement
    locations: classpath:db/migration
  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.tradesettlement.kafka
        spring.json.use.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    listener:
      ack-mode: record
      missing-topics-fatal: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  kafka:
    topics:
      trade-events: trade-events
      trade-validation: trade-validation
      trade-enrichment: trade-enrichment
      trade-settlement: trade-settlement
      trade-status: trade-status
      trade-dlq: trade-dlq
    consumer-groups:
      validation: trade-validation-service
      enrichment: trade-enrichment-service
      settlement: trade-settlement-service
      status: trade-status-service
      dlq: trade-dlq-monitor
